<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07131a" />
    <meta name="description" content="Atlas de Asedio, juego táctico de estrategia hexagonal para dos jugadores." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Atlas de Asedio</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Atlas de Asedio">
          <img src="/atlas-mark.svg" alt="" width="38" height="38" />
          <div>
            <span class="eyebrow">ESTRATEGIA HEXAGONAL</span>
            <strong>Atlas de Asedio</strong>
          </div>
        </div>

        <div class="match-status" aria-live="polite">
          <div class="fortress-status player-blue" id="blue-fortress"></div>
          <div class="turn-chip" id="turn-chip"></div>
          <div class="fortress-status player-amber" id="amber-fortress"></div>
        </div>

        <div class="top-actions">
          <button class="icon-button" id="sound-button" type="button" aria-label="Silenciar sonido" title="Sonido">
            <span aria-hidden="true">◖))</span>
          </button>
          <button class="icon-button" id="help-button" type="button" aria-label="Abrir ayuda" title="Cómo jugar">
            <span aria-hidden="true">?</span>
          </button>
          <button class="menu-button" id="new-game-button" type="button">Nueva partida</button>
        </div>
      </header>

      <main class="game-layout">
        <section class="board-stage" aria-label="Tablero de juego">
          <div class="board-toolbar">
            <div id="selection-summary" class="selection-summary">Selecciona una unidad para desplegar sus órdenes.</div>
            <div class="zoom-controls" aria-label="Controles de vista">
              <button type="button" id="zoom-out" aria-label="Alejar">−</button>
              <button type="button" id="reset-view" aria-label="Centrar tablero">◎</button>
              <button type="button" id="zoom-in" aria-label="Acercar">+</button>
            </div>
          </div>
          <div class="canvas-wrap" id="canvas-wrap">
            <canvas id="game-canvas" tabindex="0" role="grid" aria-label="Tablero hexagonal interactivo" aria-rowcount="11" aria-colcount="11" aria-owns="sr-board"></canvas>
            <div class="canvas-hint" id="canvas-hint" aria-hidden="true"></div>
          </div>
          <div class="legend" aria-label="Leyenda del tablero">
            <span><i class="legend-dot move"></i>Movimiento</span>
            <span><i class="legend-dot attack"></i>Ataque</span>
            <span><i class="legend-dot convert"></i>Conversión</span>
            <span><i class="legend-dot danger"></i>Intercepción AA</span>
          </div>
        </section>

        <aside class="command-panel" id="command-panel" aria-label="Panel de mando">
          <div class="panel-heading">
            <span class="eyebrow">PANEL DE MANDO</span>
            <span class="keyboard-hint">ESC para cancelar</span>
          </div>
          <div id="piece-card" class="piece-card empty-state"></div>
          <div id="action-controls" class="action-controls"></div>
          <div id="pending-card" class="pending-card" hidden></div>
          <div class="panel-footer">
            <button type="button" class="secondary-button mobile-new-game" id="mobile-new-game-button">Nueva partida</button>
            <button type="button" class="secondary-button" id="blockade-button">Proponer tablas</button>
            <button type="button" class="text-button" id="log-toggle" aria-expanded="false">Registro de batalla</button>
          </div>
          <ol id="battle-log" class="battle-log" hidden></ol>
        </aside>
      </main>

      <div id="sr-board" class="sr-only" role="rowgroup" aria-label="Representación textual del tablero"></div>
      <div id="announcer" class="sr-only" aria-live="assertive"></div>
    </div>

    <dialog id="game-dialog" class="game-dialog"></dialog>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
